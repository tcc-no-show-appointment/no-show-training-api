name: Trigger auto deployment for dev-noshowtrainingapi

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: [main]
    paths:
      - "**"
      - ".github/workflows/dev-noshowtrainingapi-AutoDeployTrigger-5220f0a0-7a97-45fe-bf84-e07148b2cb07.yml"

  # Allow manual trigger
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.DEVNOSHOWTRAININGAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.DEVNOSHOWTRAININGAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DEVNOSHOWTRAININGAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push container to Docker Hub
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: pauloht3/no-show-training-api:${{ github.sha }}
          file: ./Dockerfile

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          registryUrl: docker.io
          registryUsername: ${{ secrets.DOCKERHUB_USERNAME }}
          registryPassword: ${{ secrets.DOCKERHUB_PASSWORD }}
          containerAppName: dev-noshowtrainingapi
          resourceGroup: resources
          imageToDeploy: pauloht3/no-show-training-api:${{ github.sha }}

